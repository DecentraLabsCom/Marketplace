name: Authentication revocation reconciliation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    name: Drain authentication revocation outboxes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate reconciliation configuration
        env:
          MARKETPLACE_BASE_URL: ${{ secrets.MARKETPLACE_BASE_URL }}
          FMU_REVOCATION_RECONCILIATION_TOKEN: ${{ secrets.FMU_REVOCATION_RECONCILIATION_TOKEN }}
        run: |
          test -n "$MARKETPLACE_BASE_URL"
          test -n "$FMU_REVOCATION_RECONCILIATION_TOKEN"

      - name: Drain pending FMU and SAML revocations
        env:
          MARKETPLACE_BASE_URL: ${{ secrets.MARKETPLACE_BASE_URL }}
          FMU_REVOCATION_RECONCILIATION_TOKEN: ${{ secrets.FMU_REVOCATION_RECONCILIATION_TOKEN }}
        run: |
          curl --fail-with-body --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $FMU_REVOCATION_RECONCILIATION_TOKEN" \
            "$MARKETPLACE_BASE_URL/api/internal/fmu-revocation"
