name: JWT Key Rotation

on:
  # Ejecutar cada 3 meses (el 1 de enero, abril, julio, octubre a las 2 AM UTC)
  schedule:
    - cron: '0 2 1 1,4,7,10 *'  # 2 AM UTC on Jan 1, Apr 1, Jul 1, Oct 1
  
  # También permitir ejecución manual
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rotation even if not needed'
        required: false
        default: false
        type: boolean

jobs:
  rotate-jwt-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check if rotation is needed
        id: check-rotation
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needs_rotation=true" >> $GITHUB_OUTPUT
            echo "Forced rotation requested"
          else
            # Check if current keys are older than 85 days (5 days before 90-day target)
            if [ -f "certificates/jwt/rotation-metadata.json" ]; then
              last_rotation=$(jq -r '.lastRotation' certificates/jwt/rotation-metadata.json)
              if [ "$last_rotation" != "null" ]; then
                # Calculate days since last rotation
                days_since=$(( ($(date +%s) - $(date -d "$last_rotation" +%s)) / 86400 ))
                echo "Days since last rotation: $days_since"
                
                if [ $days_since -gt 85 ]; then
                  echo "needs_rotation=true" >> $GITHUB_OUTPUT
                  echo "Rotation needed - $days_since days since last rotation"
                else
                  echo "needs_rotation=false" >> $GITHUB_OUTPUT
                  echo "Rotation not needed - only $days_since days since last rotation"
                fi
              else
                echo "needs_rotation=true" >> $GITHUB_OUTPUT
                echo "No valid last rotation date found"
              fi
            else
              echo "needs_rotation=true" >> $GITHUB_OUTPUT
              echo "No rotation metadata found - first rotation"
            fi
          fi
        
      - name: Rotate JWT Keys
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        id: rotate-keys
        run: |
          # Create backup suffix with current date
          backup_suffix=$(date +%Y-%m-%d)-automated
          
          # Run key rotation (call node directly to avoid npm arg passthrough edge cases)
          node scripts/rotate-jwt-keys.js --force --backup-suffix=$backup_suffix
          
          # Verify new keys were generated
          if [ ! -f "certificates/jwt/marketplace-private-key.pem" ]; then
            echo "Error: Private key not found after rotation"
            exit 1
          fi
          
          if [ ! -f "certificates/jwt/marketplace-public-key.pem" ]; then
            echo "Error: Public key not found after rotation"
            exit 1
          fi

          candidate_kid=$(jq -r '.keys[0].kid // empty' public/.well-known/jwks.json)
          if [ -z "$candidate_kid" ]; then
            echo "Error: Candidate kid not found in generated JWKS"
            exit 1
          fi
          echo "candidate_kid=$candidate_kid" >> "$GITHUB_OUTPUT"
          
          echo "Key rotation completed successfully"

      - name: Set Rotation Date
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        id: rotation-date
        run: |
          echo "value=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_PR_TOKEN }}
          commit-message: "Automated JWT key rotation - ${{ steps.rotation-date.outputs.value }}"
          title: "Automated JWT Key Rotation - ${{ steps.rotation-date.outputs.value }}"
          body: |
            ## 🔄 Automated JWT Key Rotation
            
            This PR contains an automated JWT key rotation performed on ${{ steps.rotation-date.outputs.value }}.
            
            ### ✅ Changes Applied:
            - 🔑 New RSA key pair generated and validated
            - 💾 Previous keys backed up to `certificates/jwt/backups/`
            - 📊 Rotation metadata updated
            - 🔐 JWKS contains the candidate key and the previous key for overlap
            - 🌐 Production deployment will be triggered by merge to main
            
            ### 🎯 Safe cutover:
            Vercel environment variables are updated only after this PR is merged and
            the deployed `/.well-known/jwks.json` exposes the candidate `kid`. This
            makes the overlap visible to validators before Marketplace signs with the
            new private key.
            
            ### ⚠️ Post-Merge Checklist:
            1. ✅ Review this PR for any issues
            2. ✅ Merge to main branch
            3. ✅ Confirm the rotation workflow activates Vercel variables after JWKS deployment
            4. 🔍 Test authentication flow:
               - SSO login via eduGAIN/RedIRIS
               - JWT token generation
               - Lab access with new tokens
            5. 📊 Monitor logs for JWT validation:
               - Marketplace logs (Vercel)
               - Auth-service logs, including `kid` selection and refreshes
            6. 🌐 Verify JWKS endpoint: `curl https://your-domain/.well-known/jwks.json`
            
            ### 📁 Files Changed:
            - `public/.well-known/public-key.pem` (new public key, committed for client verification)
            - `public/.well-known/jwks.json` (candidate and previous keys with `kid`)
            
            > **Note**: Private key, rotation metadata, and backups are stored in `certificates/jwt/` (gitignored) and not committed to the repository. The new keys are applied via Vercel environment variables.
            
            ### 🔧 Troubleshooting:
            If authentication issues occur after deployment:
            1. Check Vercel environment variables are correctly set
            2. Verify deployment completed without errors
            3. Verify the candidate `kid` is in the deployed JWKS
            4. Check auth-service logs for the selected `kid` and refresh result
            5. Check logs for JWT signature validation errors
            
            **🚨 Emergency Rollback**: If critical issues occur, restore previous keys from backups using:
            ```bash
            npm run show-keys-for-vercel
            # Copy backup keys to Vercel environment variables manually
            ```
          branch: automated/jwt-key-rotation-${{ steps.rotation-date.outputs.value }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.check-rotation.outputs.needs_rotation == 'true' && steps.create-pr.outputs.pull-request-number != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BOT_PR_TOKEN }}
          script: |
            const pull_number = Number('${{ steps.create-pr.outputs.pull-request-number }}')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const timeoutMs = 5 * 60 * 1000
            const pollMs = 15 * 1000
            const startedAt = Date.now()

            while (Date.now() - startedAt < timeoutMs) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              })

              const mergeable = pr.mergeable
              const mergeableState = pr.mergeable_state

              core.info(`PR #${pull_number} mergeable=${mergeable} mergeable_state=${mergeableState}`)

              if (mergeable === true && mergeableState !== 'unknown') {
                core.info('Pull request is stable enough to attempt auto-merge')
                return
              }

              await new Promise((resolve) => setTimeout(resolve, pollMs))
            }

            core.warning('Pull request did not become stable before timeout; continuing to auto-merge attempt anyway')

      - name: Enable Auto-Merge
        if: steps.check-rotation.outputs.needs_rotation == 'true' && steps.create-pr.outputs.pull-request-number != ''
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.BOT_PR_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash

      - name: Wait for rotation PR to merge before activating the candidate key
        if: steps.check-rotation.outputs.needs_rotation == 'true' && steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BOT_PR_TOKEN }}
          script: |
            const pull_number = Number('${{ steps.create-pr.outputs.pull-request-number }}')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const timeoutMs = 60 * 60 * 1000
            const pollMs = 30 * 1000
            const startedAt = Date.now()

            while (Date.now() - startedAt < timeoutMs) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })
              core.info(`PR #${pull_number}: merged=${Boolean(pr.merged_at)} state=${pr.state}`)
              if (pr.merged_at) return
              if (pr.state === 'closed') throw new Error(`Rotation PR #${pull_number} was closed without merging`)
              await new Promise((resolve) => setTimeout(resolve, pollMs))
            }

            throw new Error(`Rotation PR #${pull_number} did not merge within the activation window`)

      - name: Wait for deployed JWKS to expose the candidate key
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        env:
          CANDIDATE_KID: ${{ steps.rotate-keys.outputs.candidate_kid }}
          MARKETPLACE_URL: https://www.decentralabs-marketplace.app
        run: |
          echo "Waiting for deployed JWKS to expose kid ${CANDIDATE_KID}..."
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --location \
              "${MARKETPLACE_URL}/.well-known/jwks.json?rotation-check=${{ github.run_id }}" \
              | jq -e --arg kid "$CANDIDATE_KID" '.keys | any(.[]; .kid == $kid)' >/dev/null; then
              echo "Candidate JWKS key is live"
              exit 0
            fi
            echo "JWKS does not expose the candidate yet (attempt ${attempt}/120)"
            sleep 10
          done
          echo "Candidate key was not exposed by the deployed JWKS"
          exit 1

      - name: Activate candidate key in Vercel
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # pragma: allowlist secret
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }} # pragma: allowlist secret
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }} # pragma: allowlist secret
        run: |
          echo "Activating JWT signing key after overlapping JWKS deployment..."
          node scripts/update-vercel-env.js --targets=production
          echo "Candidate signing key activated"

      - name: Redeploy production with the activated Vercel variables
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        env:
          MARKETPLACE_URL: https://www.decentralabs-marketplace.app
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # pragma: allowlist secret
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }} # pragma: allowlist secret
        run: |
          vercel_args=(redeploy "$MARKETPLACE_URL" --target production --token "$VERCEL_TOKEN" --non-interactive)
          if [ -n "$VERCEL_TEAM_ID" ]; then
            vercel_args+=(--scope "$VERCEL_TEAM_ID")
          fi
          npx --yes vercel@latest "${vercel_args[@]}"
          
      - name: Notify team (optional)
        if: steps.check-rotation.outputs.needs_rotation == 'true'
        run: |
          echo "JWT key rotation completed and PR created"
          echo "Next steps: Review PR, merge, and monitor deployment"
          # You could add Slack/Teams notification here

